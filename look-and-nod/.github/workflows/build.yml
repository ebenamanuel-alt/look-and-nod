name: Build Look and Nod

# Builds the Mac app on GitHub's own Mac and gives you a zip to download.
# Runs whenever the app files change, or press "Run workflow" on the Actions tab.
on:
  push:
    paths:
      - "look-and-nod/app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        working-directory: look-and-nod/app
        run: bash build.sh

      - name: Zip the app
        working-directory: look-and-nod/app
        # ditto keeps the app's permissions so it still opens after downloading
        run: ditto -c -k --keepParent "Look and Nod.app" "Look and Nod.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Look-and-Nod
          path: look-and-nod/app/Look and Nod.zip
